experimental = ["setup-scripts"]

# Under a full parallel run a test process can take over the 100ms default to
# close its output pipes, which flagged random tests as leaky. Real leaks (a
# child that keeps running) still exceed this.
[profile.default]
leak-timeout = "500ms"

# These tests enforce wall-clock interaction budgets, so they must not compete
# with CPU-heavy tests for runner time.
[[profile.default.overrides]]
filter = 'test(/^app::harness_tests::(persistence::current_compacted_read_only_session_forks_without_hydrating_or_cloning_history|persistence::large_response_keeps_history_append_and_follow_up_enter_responsive|persistence::large_sparse_fork_preserves_every_canonical_history_and_record_row|search::transcript_search_rapid_typing_cancels_stale_worker_generations)$/)'
threads-required = "num-test-threads"

# Start the longest tests first so they overlap the bulk of the suite instead
# of finishing alone at its tail. The startup quota and fuzz CLI tests mostly
# wait on real provider delays and watchdogs; the transcript sweeps are CPU-bound.
[[profile.default.overrides]]
filter = '''
(binary(startup) & test(/quota/))
| (package(xtask) & test(/^fuzz::cli_tests::(build_timeout|byte_triage_bounds)/))
| (package(smelt-tui) & test(/^app::harness_tests::(misc::(long_upward_motions|block_jumps_from_any_row)|scroll_geometry::(thumb_drag_sweeps_underestimated|wheel_scrolling)|gallery::every_gallery_plugin)/))
'''
priority = 50

# Tests and the smelt processes they spawn log and persist under the state dir;
# keep them out of the developer's real one. Nextest has no teardown scripts, so
# each run first removes the state dirs that runs left over a day ago.
[scripts.setup.isolate-state]
command = ["sh", "-c", '''
tmp="${TMPDIR:-/tmp}"
find "$tmp" -maxdepth 1 -name 'smelt-nextest-state.*' -type d -mmin +1440 -exec rm -rf {} + 2>/dev/null
echo "XDG_STATE_HOME=$(mktemp -d "$tmp/smelt-nextest-state.XXXXXX")" >> "$NEXTEST_ENV"
''']

[[profile.default.scripts]]
filter = "all()"
setup = "isolate-state"

# Per-test durations for finding slow tests: target/nextest/default/junit.xml.
[profile.default.junit]
path = "junit.xml"
