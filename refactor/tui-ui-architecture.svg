306.6632" x2="5518.2305" y1="331.9019" y2="331.9019"/><line style="stroke:#000000;stroke-width:1;" x1="5306.6632" x2="5518.2305" y1="347.6313" y2="347.6313"/><line style="stroke:#000000;stroke-width:1;" x1="5306.6632" x2="5518.2305" y1="363.3608" y2="363.3608"/><line style="stroke:#000000;stroke-width:1;" x1="5306.6632" x2="5518.2305" y1="379.0903" y2="379.0903"/><line style="stroke:#000000;stroke-width:1;" x1="5306.6632" x2="5518.2305" y1="394.8198" y2="394.8198"/><line style="stroke:#000000;stroke-width:1;" x1="5306.6632" x2="5518.2305" y1="410.5493" y2="410.5493"/><line style="stroke:#000000;stroke-width:1;" x1="5306.6632" x2="5518.2305" y1="426.2788" y2="426.2788"/><line style="stroke:#000000;stroke-width:1;" x1="5306.6632" x2="5518.2305" y1="442.0083" y2="442.0083"/><line style="stroke:#000000;stroke-width:1;" x1="5306.6632" x2="5306.6632" y1="206.0659" y2="442.0083"/><line style="stroke:#000000;stroke-width:1;" x1="5415.2842" x2="5415.2842" y1="206.0659" y2="442.0083"/><line style="stroke:#000000;stroke-width:1;" x1="5460.8858" x2="5460.8858" y1="206.0659" y2="442.0083"/><line style="stroke:#000000;stroke-width:1;" x1="5518.2305" x2="5518.2305" y1="206.0659" y2="442.0083"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="381.8813" x="5306.6632" y="456.6021">| border / title  |  &#8212;     |   &#8212;    |  ' on LayoutTree (any container)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="348.5688" x="5306.6632" y="472.3315">| panel dividers  |  &#8212;     |   &#8212;    |  ' on LayoutTree (parent)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="5306.6632" y="488.061">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="300.4346" x="5306.6632" y="503.7905">Same Buffer can have 0..N Windows looking at it</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="298.6128" x="5306.6632" y="519.52">with independent cursors/scrolls. No BufferView</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="78.8125" x="5306.6632" y="535.2495">middle layer.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="5306.6632" y="550.979">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.5786" x="5306.6632" y="566.7085">Composing widgets</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="135.4019" x="5433.2418" y="566.7085">: a "dialog with a list +</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="77.2891" x="5306.6632" y="582.438">text input" is</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.0005" x="5387.6085" y="582.438">N Windows in one Overlay</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="31.0591" x="5554.609" y="582.438">. The</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="315.5991" x="5306.6632" y="598.1675">Overlay's `layout` is a Vbox/Hbox of `Leaf(WinId)`s,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="228.3379" x="5306.6632" y="613.897">with chrome on the Vbox/Hbox itself.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="313.7964" x="5306.6632" y="629.6265">No compound-widget type, no group type &#8212; every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="304.5479" x="5306.6632" y="645.356">composite shape is N&#215;Window inside an Overlay.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="5306.6632" y="661.0854">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.8149" x="5306.6632" y="676.8149">Rendering model</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="170.3774" x="5414.4781" y="676.8149">: event-driven + diff-based,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="256.915" x="5306.6632" y="692.5444">no dirty flag. The loop renders after every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="288.501" x="5306.6632" y="708.2739">event; the compositor diffs current vs previous</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="279.9697" x="5306.6632" y="724.0034">Grid and flushes only changed cells. Idle CPU</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="275.5835" x="5306.6632" y="739.7329">is zero (loop parks). Things that change over</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="250.0659" x="5306.6632" y="755.4624">time (clock, spinner) drive a `Cell` from a</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="224.9102" x="5306.6632" y="771.1919">timer; the Cell setter wakes the loop.</text></g><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="459.432" x2="459.432" y1="7973.8984" y2="8038.6279"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="459.432" x2="5816.067" y1="8038.6279" y2="8038.6279"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="5816.067" x2="5816.067" y1="8038.6279" y2="8063.6279"/><polygon fill="#888888" points="5816.067,8063.6279,5820.067,8054.6279,5816.067,8058.6279,5812.067,8054.