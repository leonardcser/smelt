265" y="7668.6831">cmd_tx:  Sender&lt;UiCommand&gt;</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="223.2549" x="3470.8265" y="7685.6226">event_rx: Receiver&lt;EngineEvent&gt;</text><line style="stroke:#181818;stroke-width:1;" x1="3465.8265" x2="3699.0814" y1="7692.9995" y2="7692.9995"/><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="194.6943" x="3470.8265" y="7710.562">The ONLY way frontends talk</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="161.2666" x="3470.8265" y="7727.5015">to engine. No trait impls,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="170.0439" x="3470.8265" y="7744.4409">no callbacks, no UI types.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="176.6133" x="3470.8265" y="7761.3804">No engine-side state leaks</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="128.1123" x="3470.8265" y="7778.3198">(no `processes`, no</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="155.4561" x="3470.8265" y="7795.2593">`runtime_approvals`, no</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="159.7832" x="3470.8265" y="7812.1987">`permissions`) &#8212; all that</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="130.7373" x="3470.8265" y="7829.1382">lives in core::* now.</text></g><!--class EngineConfig--><g class="entity" data-qualified-name="ENG.EngineConfig" data-source-line="829" id="ent0112"><rect fill="#F1F1F1" height="32" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="121.1475" x="2024.9476" y="7707.0884"/><ellipse cx="2039.9476" cy="7723.0884" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-widt