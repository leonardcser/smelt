4251.207" y2="4271.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2547.8976" x2="2824.7511" y1="4271.207" y2="4271.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2824.7511" x2="2824.7511" y1="4271.207" y2="4341.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2824.7511" x2="2974.117" y1="4341.207" y2="4341.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2974.117" x2="2974.117" y1="4341.207" y2="4411.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2974.117" x2="2984.1232" y1="4411.207" y2="4411.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2984.1232" x2="2984.1232" y1="4411.207" y2="4691.8545"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2984.1232" x2="1664.2386" y1="4691.8545" y2="4691.8545"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1664.2386" x2="1664.2386" y1="4691.8545" y2="4939.584"/><polygon fill="#FFFFFF" points="1664.2386,4939.584,1671.2386,4920.584,1657.2386,4920.584,1664.2386,4939.584" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2283.6645" x2="2283.6645" y1="4251.207" y2="4281.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2283.6645" x2="2814.7511" y1="4281.207" y2="4281.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2814.7511" x2="2814.7511" y1="4281.207" y2="4351.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2814.7511" x2="2964.117" y1="4351.207" y2="4351.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2964.117" x2="2964.117" y1="4351.207" y2="4421.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2964.117" x2="2970.1232" y1="4421.207" y2="4421.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2970.1232" x2="2970.1232" y1="4421.207" y2="4681.8545"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2970.1232" x2="1630.8759" y1="4681.8545" y2="4681.8545"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1630.8759" x2="1630.8759" y1="4681.8545" y2="4939.584"/><polygon fill="#FFFFFF" points="1630.8759,4939.584,1637.8759,4920.584,1623.8759,4920.584,1630.8759,4939.584" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2804.7511" x2="2804.7511" y1="4251.207" y2="4391.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2804.7511" x2="2805.0138" y1="4391.207" y2="4391.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2805.0138" x2="2805.0138" y1="4391.207" y2="4546.666"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2805.0138" x2="1000.3302" y1="4546.666" y2="4546.666"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1000.3302" x2="1000.3302" y1="4546.666" y2="4584.3955"/><polygon fill="#181818" points="1000.3302,4584.3955,1004.3302,4575.3955,1000.3302,4579.3955,996.3302,4575.3955,1000.3302,4584.3955" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="141.8701" x="2659.1437" y="4463.6655">writes lines + extmarks</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2646.1437" x2="2646.1437" y1="4251.207" y2="4536.666"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2646.1437" x2="993.0067" y1="4536.666" y2="4536.666"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="993.0067" x2="993.0067" y1="4536.666" y2="4584.3955"/><polygon fill="#181818" points="993.0067,4584.3955,997.0067,4575.3955,993.0067,4579.3955,989.0067,4575.3955,993.0067,4584.3955" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="141.8701" x="2500.2736" y="4463.6655">writes lines + extmarks</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2507.8637" x2="2507.8637" y1="4251.207" y2="4411.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2507.8637" x2="1598.5759" y1="4411.207" y2="4411.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1598.5759" x2="1598.5759" y1="4411.207" y2="4526.666"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1598.5759" x2="985.6833" y1="4526.666" y2="4526.666"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="985.6833" x2="985.6833" y1="4526.666" y2="4584.3955"/><polygon fill="#181818" points="985.6833,4584.3955,989.6833,4575.3955,985.6833,4579.3955,981.6833,4575.3955,985.6833,4584.3955" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="141.8701" x="1452.7058" y="4463.6655">writes lines + extmarks</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2119.4991" x2="2119.4991" y1="4251.207" y2="4401.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2119.4991" x2="1439.7058" y1="4401.207" y2="4401.207"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1439.7058" x2="1439.7058" y1="4401.207" y2="4516.666"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1439.7058" x2="978.3599" y1="4516.666" y2="4516.666"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="978.3599" x2="978.3599" y1="4516.666" y2="4584.3955"/><polygon fill="#181818" points="978.3599,4584.3955,982.3599,4575.3955,978.3599,4579.3955,974.3599,4575.3955,978.3599,4584.3955" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="149.1699" x="1286.5358" y="4463.6655">writes per-block buffers</text><g class="legend" data-source-line="14"><rect fill="#DDDDDD" height="958.6094" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="500.5742" x="6399.6043" y="8121.3408"/><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="223.3574" x="6404.6043" y="8139.9033">Target organization (post P11.C):</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="434.8477" x="6404.6043" y="8156.8428">- `core` &#8212; frontend-agnostic; no terminal imports, no `crossterm`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="169.7021" x="6412.4793" y="8173.7822">no editor / renderer deps.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="411.585" x="6404.6043" y="8190.7217">- `smelt-buffer` &#8212; shared data layer: `Buffer`, extmarks, undo,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="380.748" x="6412.4793" y="8207.6611">`Theme`, `Style`, `Color`, clipboard, attachments. Both the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="405.877" x="6412.4793" y="8224.6006">renderer and editor depend on it; pure data, no terminal calls.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="404.8857" x="6404.6043" y="8241.54">- `smelt-term` &#8212; pure terminal renderer: `Grid`, `Compositor`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="454.6924" x="6412.4793" y="8258.4795">`LayoutTree&lt;PaintId&gt;`, `flush_diff`, chrome paint, `paint_layout_tree`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="435.2646" x="6412.4793" y="8275.4189">No `Window`, no vim, no editor concepts. Standalone; usable as a</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="177.4883" x="6412.4793" y="8292.3584">TUI library (e.g. by `tcloc`).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="377.1113" x="6404.6043" y="8309.2979">- `smelt-edit` &#8212; editor layer over `smelt-term`: `Window`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="432.9473" x="6412.4793" y="8326.2373">`DrawContext`, `Buffer` dispatch, vim modes, callbacks, overlays,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="422.29" x="6412.4793" y="8343.1768">focus + capture + click-tracking. The `Ui` struct ties windows to</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="448.916" x="6412.4793" y="8360.1162">layout and routes events; its renderer is a `smelt_term::Compositor`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="388.6094" x="6404.6043" y="8377.0557">- `tui` &#8212; terminal frontend; depends on `core`, `smelt-edit`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="426.4053" x="6412.4793" y="8393.9951">`smelt-buffer`, and `crossterm`. Re-exports the editor surface as</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="315.9775" x="6412.4793" y="8410.9346">`pub use ::smelt_edit as smelt_term;` so existing</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="276.6641" x="6412.4793" y="8427.874">`crate::smelt_term::*` paths keep working.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="397.7285" x="6404.6043" y="8444.8135">- `engine` / `protocol` &#8212; unchanged; LLM core + wire types.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6404.6043" y="8461.7529">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="361.7646" x="6404.6043" y="8478.6924">A GUI or web frontend uses `core` directly and ignores</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="458.4111" x="6404.6043" y="8495.6318">`smelt-{term,edit}`. A non-editor TUI consumer (treemap, dashboard)</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="367.5273" x="6404.6043" y="8512.5713">uses `smelt-term` directly with its own paint dispatcher.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6404.6043" y="8529.5107">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="205.3857" x="6404.6043" y="8546.4502">`Buffer` lives in `smelt-buffer`</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="149.0029" x="6613.9276" y="8546.4502">(was: `core`). It is pure</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="419.9658" x="6404.6043" y="8563.3896">data &#8212; lines, extmarks, namespaces, undo. Zero terminal deps.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="442.2441" x="6404.6043" y="8580.3291">Headless reads transcript content through the same surface as the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="417.0264" x="6404.6043" y="8597.2686">TUI does. Parser *implementations* (markdown / diff / syntax /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="269.4727" x="6404.6043" y="8614.208">bash) stay in `tui` because they pull from</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="408.4678" x="6404.6043" y="8631.1475">`tui::content::highlight::*` (syntect, inline markdown, diff LCS).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6404.6043" y="8648.0869">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="274.1895" x="6404.6043" y="8665.0264">Lua's drawing context is full, not partial.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="91.3145" x="6682.7313" y="8665.0264">Tool / dialog /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="423.5342" x="6404.6043" y="8681.9658">statusline `render` callbacks receive a `Buffer` userdata with the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="414.9072" x="6404.6043" y="8698.9053">full Buffer API (set_lines / add_highlight / set_extmark / attach /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="488.7969" x="6404.6043" y="8715.8447">namespaces / virt-text). No `RenderCtx`-style enum-of-allowed-methods.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="406.793" x="6404.6043" y="8732.7842">Shipped Rust renderers (smelt.bash.render, smelt.diff.render,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="447.2959" x="6404.6043" y="8749.7236">smelt.syntax.render, smelt.notebook.render) sit on top of the Buffer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="251.7334" x="6404.6043" y="8766.6631">API as conveniences, not in front of it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6404.6043" y="8783.6025">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="377.1387" x="6404.6043" y="8800.542">No tool/command/dialog/mode name matching in Rust.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="109.498" x="6785.6805" y="8800.542">A `match name {</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="397.127" x="6404.6043" y="8817.4814">"bash" =&gt; &#8230; }` over a Lua-registered identifier is a bug. The</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="394.502" x="6404.6043" y="8834.4209">registration table carries the metadata; Rust calls through it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6404.6043" y="8851.3604">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="266.8613" x="6404.6043" y="8868.2998">Plugin-author surface (P9.f-y, landed).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="161.7998" x="6675.4032" y="8868.2998">Namespaces are integer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="456.7705" x="6404.6043" y="8885.2393">handles minted by `smelt.buf.create_namespace`. Extmark API is one</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="364.6768" x="6404.6043" y="8902.1787">keyset call mirroring nvim verbatim (`hl_eol`, `hl_mode`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="336.7588" x="6404.6043" y="8919.1182">`virt_text_pos`, gravity, priority, etc.). Plugins live in</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="420.6221" x="6404.6043" y="8936.0576">`/.config/smelt/` AND project-local `&lt;cwd&gt;/.smelt/` (trust-gated</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="352.9053" x="6404.6043" y="8952.9971">via SHA-256). Tool files auto-register on require. Cell</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="361.8467" x="6404.6043" y="8969.9365">subscribers see (new, old); user-namespaced cells via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="378.7725" x="6404.6043" y="8986.876">`smelt.cell.user(...)`. `require` searches workspace + user</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="434.0342" x="6404.6043" y="9003.8154">runtime before embedded fallback (P9.j). Read-only tools opt into</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="426.9727" x="6404.6043" y="9020.7549">parallel execution (P9.k). Permission defaults declared in Lua via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="438.751" x="6404.6043" y="9037.6943">`permission_defaults` / `default_allow` (P9.y). Provider middleware</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="52.6094" x="6404.6043" y="9054.6338">remains</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="59.6436" x="6461.1512" y="9054.6338">deferred</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="280.6084" x="6524.7323" y="9054.6338">(P9.i &#8212; speculative seam, lands when first</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="158.5596" x="6404.6043" y="9071.5732">consumer materializes).</text></g><?plantuml-src jNthSjj8bkP_FaMkAc94ohoKktjggscLDsHTofgMROKkrTMzsY110YJH1W4E05fMbMjZVlN_xTs8UODv