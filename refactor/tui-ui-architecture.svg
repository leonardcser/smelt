stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1754.353" y1="357.8413" y2="357.8413"/><line style="stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1754.353" y1="373.5708" y2="373.5708"/><line style="stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1754.353" y1="389.3003" y2="389.3003"/><line style="stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1754.353" y1="405.0298" y2="405.0298"/><line style="stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1754.353" y1="420.7593" y2="420.7593"/><line style="stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1754.353" y1="436.4888" y2="436.4888"/><line style="stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1754.353" y1="452.2183" y2="452.2183"/><line style="stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1754.353" y1="467.9478" y2="467.9478"/><line style="stroke:#000000;stroke-width:1;" x1="1542.7857" x2="1542.7857" y1="232.0054" y2="467.9478"/><line style="stroke:#000000;stroke-width:1;" x1="1651.4068" x2="1651.4068" y1="232.0054" y2="467.9478"/><line style="stroke:#000000;stroke-width:1;" x1="1697.0083" x2="1697.0083" y1="232.0054" y2="467.9478"/><line style="stroke:#000000;stroke-width:1;" x1="1754.353" x2="1754.353" y1="232.0054" y2="467.9478"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="381.8813" x="1542.7857" y="482.5415">| border / title  |  &#8212;     |   &#8212;    |  ' on LayoutTree (any container)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="348.5688" x="1542.7857" y="498.271">| panel dividers  |  &#8212;     |   &#8212;    |  ' on LayoutTree (parent)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="1542.7857" y="514.0005">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="300.4346" x="1542.7857" y="529.73">Same Buffer can have 0..N Windows looking at it</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="298.6128" x="1542.7857" y="545.4595">with independent cursors/scrolls. No BufferView</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="78.8125" x="1542.7857" y="561.189">middle layer.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="1542.7857" y="576.9185">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.5786" x="1542.7857" y="592.6479">Composing widgets</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="135.4019" x="1669.3643" y="592.6479">: a "dialog with a list +</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="77.2891" x="1542.7857" y="608.3774">text input" is</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.0005" x="1623.731" y="608.3774">N Windows in one Overlay</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="31.0591" x="1790.7315" y="608.3774">. The</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="315.5991" x="1542.7857" y="624.1069">Overlay's `layout` is a Vbox/Hbox of `Leaf(WinId)`s,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="228.3379" x="1542.7857" y="639.8364">with chrome on the Vbox/Hbox itself.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="313.7964" x="1542.7857" y="655.5659">No compound-widget type, no group type &#8212; every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="304.5479" x="1542.7857" y="671.2954">composite shape is N&#215;Window inside an Overlay.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="1542.7857" y="687.0249">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.8149" x="1542.7857" y="702.7544">Rendering model</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="170.3774" x="1650.6006" y="702.7544">: event-driven + diff-based,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="256.915" x="1542.7857" y="718.4839">no dirty flag. The loop renders after every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="288.501" x="1542.7857" y="734.2134">event; the compositor diffs current vs previous</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="279.9697" x="1542.7857" y="749.9429">Grid and flushes only changed cells. Idle CPU</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="275.5835" x="1542.7857" y="765.6724">is zero (loop parks). Things that change over</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="250.0659" x="1542.7857" y="781.4019">time (clock, spinner) drive a `Cell` from a</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="224.9102" x="1542.7857" y="797.1313">timer; the Cell setter wakes the loop.</text></g><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="1671.6497" x2="1671.6497" y1="7570.8535" y2="7645.583"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="1671.6497" x2="215.7871" y1="7645.583" y2="7645.583"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="215.7871" x2="215.7871" y1="7645.583" y2="7680.583"/><polygon fill="#888888" points="215.7871,7680.583,219.7871,7671.583,21