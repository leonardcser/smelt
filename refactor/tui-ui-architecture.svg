Adjust="spacing" textLength="170.0439" x="377.0137" y="7785.6997">no callbacks, no UI types.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="176.6133" x="377.0137" y="7802.6392">No engine-side state leaks</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="128.1123" x="377.0137" y="7819.5786">(no `processes`, no</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="155.4561" x="377.0137" y="7836.5181">`runtime_approvals`, no</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="159.7832" x="377.0137" y="7853.4575">`permissions`) &#8212; all that</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="130.7373" x="377.0137" y="7870.397">lives in core::* now.</text></g><!--class EngineConfig--><g class="entity" data-qualified-name="ENG.EngineConfig" data-source-line="659" id="ent0090"><rect fill="#F1F1F1" height="32" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="121.1475" x="626.2686" y="7748.3472"/><ellipse cx="641.2686" cy="7764.3472" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M643.7417,7770.4902 Q643.1606,7770.7891 642.5215,7770.9385 Q641.8823,7771.0879 641.1768,7771.0879 Q638.6699,7771.0879 637.3501,7769.436 Q636.0303,7767.7842 636.0303,7764.6631 Q636.0303,7761.5337 637.3501,7759.8818 Q638.6699,7758.23 641.1768,7758.23 Q641.8823,7758.23 642.5298,7758.3794 Q643.1772,7758.5288 643.7417,7758.8276 L643.7417,7761.5503 Q643.1108,7760.9692 642.5173,7760.6995 Q641.9238,7760.4297 641.293,7760.4297 Q639.9482,7760.4297 639.2634,7761.4963 Q638.5786,7762.563 638.5786,7764.6631 Q638.5786,7766.7549 639.2634,7767.8215 Q639.9482,7768.8882 641.293,7768.8882 Q641.9238,7768.8882 642.5173,7768.6184 Q643.1108,7768.3486 643.7417,7767.7676 Z " fill="#000000"/><text fill="#000000" font-family="'Inter'" font-si