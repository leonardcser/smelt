72" x2="872.5458" y1="6733.6191" y2="6733.6191"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="872.5458" x2="872.5458" y1="6733.6191" y2="6856.3486"/><polygon fill="#181818" points="872.5458,6856.3486,876.5458,6847.3486,872.5458,6851.3486,868.5458,6847.3486,872.5458,6856.3486" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="149.1699" x="4576.2637" y="4423.5796">writes per-block buffers</text><g class="legend" data-source-line="14"><rect fill="#DDDDDD" height="670.6387" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="500.5742" x="6649.3336" y="8504.3857"/><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="139.6172" x="6654.3336" y="8522.9482">Target organization:</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="232.9893" x="6797.8882" y="8522.9482">`core` and `tui` are separate crates.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="451.0078" x="6654.3336" y="8539.8877">`core` has no terminal imports and no `crossterm` / `ui` dependency.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="262.6982" x="6654.3336" y="8556.8271">`tui` depends on `core` and `crossterm`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="379.415" x="6654.3336" y="8573.7666">`ui` is a terminal UI primitives module inside `tui` (`tui::ui`);</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="173.9404" x="6654.3336" y="8590.7061">it depends on `crossterm`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="390.4414" x="6654.3336" y="8607.6455">A GUI or web frontend uses `core` directly and ignores `ui`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6654.3336" y="8624.585">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="153.7744" x="6654.3336" y="8641.5244">`Buffer` lives in `core`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="215.4277" x="6812.0455" y="8641.5244">It is pure data &#8212; lines, extmarks,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="435.4014" x="6654.3336" y="8658.4639">namespaces, undo. Zero terminal deps. Headless reads transcript</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="383.1338" x="6654.3336" y="8675.4033">content through the same surface as the TUI does. Parser</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="420.1572" x="6654.3336" y="8692.3428">*implementations* (markdown / diff / syntax / bash) stay in `tui`</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="381.2471" x="6654.3336" y="8709.2822">because they pull from `tui::content::highlight::*` (syntect,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="179.0879" x="6654.3336" y="8726.2217">inline markdown, diff LCS).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6654.3336" y="8743.1611">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="274.1895" x="6654.3336" y="8760.1006">Lua's drawing context is full, not partial.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="91.3145" x="6932.4605" y="8760.1006">Tool / dialog /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="423.5342" x="6654.3336" y="8777.04">statusline `render` callbacks receive a `Buffer` userdata with the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="414.9072" x="6654.3336" y="8793.9795">full Buffer API (set_lines / add_highlight / set_extmark / attach /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="488.7969" x="6654.3336" y="8810.9189">namespaces / virt-text). No `RenderCtx`-style enum-of-allowed-methods.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="406.793" x="6654.3336" y="8827.8584">Shipped Rust renderers (smelt.bash.render, smelt.diff.render,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="447.2959" x="6654.3336" y="8844.7979">smelt.syntax.render, smelt.notebook.render) sit on top of the Buffer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="251.7334" x="6654.3336" y="8861.7373">API as conveniences, not in front of it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6654.3336" y="8878.6768">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="377.1387" x="6654.3336" y="8895.6162">No tool/command/dialog/mode name matching in Rust.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="109.498" x="7035.4097" y="8895.6162">A `match name {</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="397.127" x="6654.3336" y="8912.5557">"bash" =&gt; &#8230; }` over a Lua-registered identifier is a bug. The</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="394.502" x="6654.3336" y="8929.4951">registration table carries the metadata; Rust calls through it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6654.3336" y="8946.4346">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="266.8613" x="6654.3336" y="8963.374">Plugin-author surface (P9.f-y, landed).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="161.7998" x="6925.1324" y="8963.374">Namespaces are integer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="456.7705" x="6654.3336" y="8980.3135">handles minted by `smelt.buf.create_namespace`. Extmark API is one</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="364.6768" x="6654.3336" y="8997.2529">keyset call mirroring nvim verbatim (`hl_eol`, `hl_mode`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="336.7588" x="6654.3336" y="9014.1924">`virt_text_pos`, gravity, priority, etc.). Plugins live in</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="420.6221" x="6654.3336" y="9031.1318">`/.config/smelt/` AND project-local `&lt;cwd&gt;/.smelt/` (trust-gated</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="352.9053" x="6654.3336" y="9048.0713">via SHA-256). Tool files auto-register on require. Cell</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="361.8467" x="6654.3336" y="9065.0107">subscribers see (new, old); user-namespaced cells via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="378.7725" x="6654.3336" y="9081.9502">`smelt.cell.user(...)`. `require` searches workspace + user</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="434.0342" x="6654.3336" y="9098.8896">runtime before embedded fallback (P9.j). Read-only tools opt into</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="426.9727" x="6654.3336" y="9115.8291">parallel execution (P9.k). Permission defaults declared in Lua via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="438.751" x="6654.3336" y="9132.7686">`permission_defaults` / `default_allow` (P9.y). Provider middleware</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="52.6094" x="6654.3336" y="9149.708">remains</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="59.6436" x="6710.8804" y="9149.708">deferred</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="280.6084" x="6774.4615" y="9149.708">(P9.i &#8212; speculative seam, lands when first</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="158.5596" x="6654.3336" y="9166.6475">consumer materializes).</text></g><?plantuml-src jNthSXjNakP_FCLPEc84KBZOtJCE3qHhW-95uZH5CaZARVTo0oW01Q2QXIfiLO4KR7bZOdxq_vdjY7c3VONzl_Cc_IIRNsQUIm4WspqhAy8cK7MkUVAUUHB_PLb4iqLaqcYThoeJf_UDHdcVPCkeY1Pcd4PbULXLHJ9QLV7PECzkaXzZysNGf9n7a_mnoMPc6gLb7BmfybKsESgBB2xCry7pIJoDLcbrccVLHRI8pTvPLiN5Nj1Y6OtlerbyKwtJs1Jnk8goMHetviaaDl5YMQtD8bwCugAiFwhc-QHiDAgaecxb8auhyvT__hEfec8MLoOgnlEaei5MHMoQPLMi-6FhBZkEnqcPv5bfecnYYgYYpn4DaIOFiKaoixz_U7tqxkpsvEZsm_L9Tp7PttzbolX_hE9iZ8rpa-kJqyEZsyjhVjrjDD9u5cEqP3Ql6eOQtCeoyc8MPScFF4b_VzyCntaH3tdcORLAw1Cjhum1Y2esO_o_xD80scuUbIRB3G5iaT0YJR9OvaKbAwVdmt6HboNU3atF337U95xIGcYfQnwcyizAasUr-NrdRegM2GtjP_jmPfP5iaWgWanf5lbabG929Kv1HcxYJxzF7rklQ8oagizLc-3GlAK1yy8ynYCpBGWV0B5LIKFhgYO9JZzTy_AIMKOFIruN0HWm7RvPJQTnCUIZAd4Gqh5BW3shiFWbJdiILH6ZGffaSTasySTg4HNtPPi6oGW5Iq8uF2TypRlc3t4H09YMNtRDkpYQf75P4ZP6j9UgYB9oN2HB7EsO5rwPQa