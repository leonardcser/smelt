2="3460.5967" y1="4444.8604" y2="4544.8604"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3460.5967" x2="3393.6702" y1="4544.8604" y2="4544.8604"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3393.6702" x2="3393.6702" y1="4544.8604" y2="4600.3193"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3393.6702" x2="3536.7796" y1="4600.3193" y2="4600.3193"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3536.7796" x2="3536.7796" y1="4600.3193" y2="6817.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3536.7796" x2="6706.1088" y1="6817.3584" y2="6817.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6706.1088" x2="6706.1088" y1="6817.3584" y2="7020.0879"/><polygon fill="#181818" points="6706.1088,7020.0879,6710.1088,7011.0879,6706.1088,7015.0879,6702.1088,7011.0879,6706.1088,7020.0879" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="141.8701" x="3247.8001" y="4577.3188">writes lines + extmarks</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3137.917" x2="3137.917" y1="4444.8604" y2="4504.8604"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3137.917" x2="3047.93" y1="4504.8604" y2="4504.8604"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3047.93" x2="3047.93" y1="4504.8604" y2="4640.3193"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3047.93" x2="3492.7796" y1="4640.3193" y2="4640.3193"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3492.7796" x2="3492.7796" y1="4640.3193" y2="6857.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3492.7796" x2="6474.3506" y1="6857.3584" y2="6857.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6474.3506" x2="6474.3506" y1="6857.3584" y2="6962.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6474.3506" x2="6652.0957" y1="6962.3584" y2="6962.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6652.0957" x2="6652.0957" y1="6962.3584" y2="7020.0879"/><polygon fill="#181818" points="6652.0957,7020.0879,6656.0957,7011.0879,6652.0957,7015.0879,6648.0957,7011.0879,6652.0957,7020.0879" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="141.8701" x="2902.0599" y="4577.3188">writes lines + extmarks</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3276.1969" x2="3276.1969" y1="4444.8604" y2="4524.8604"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3276.1969" x2="3220.8001" y1="4524.8604" y2="4524.8604"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3220.8001" x2="3220.8001" y1="4524.8604" y2="4620.3193"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3220.8001" x2="3514.7796" y1="4620.3193" y2="4620.3193"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3514.7796" x2="3514.7796" y1="4620.3193" y2="6837.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3514.7796" x2="6679.1022" y1="6837.3584" y2="6837.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6679.1022" x2="6679.1022" y1="6837.3584" y2="7020.0879"/><polygon fill="#181818" points="6679.1022,7020.0879,6683.1022,7011.0879,6679.1022,7015.0879,6675.1022,7011.0879,6679.1022,7020.0879" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="141.8701" x="3074.93" y="4577.3188">writes lines + extmarks</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2877.3271" x2="2877.3271" y1="4444.8604" y2="4494.8604"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2877.3271" x2="2875.0599" y1="4494.8604" y2="4494.8604"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2875.0599" x2="2875.0599" y1="4494.8604" y2="4660.3193"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="2875.0599" x2="3470.7796" y1="4660.3193" y2="4660.3193"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3470.7796" x2="3470.7796" y1="4660.3193" y2="6877.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3470.7796" x2="6440.9879" y1="6877.3584" y2="6877.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6440.9879" x2="6440.9879" y1="6877.3584" y2="6972.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6440.9879" x2="6625.0891" y1="6972.3584" y2="6972.3584"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6625.0891" x2="6625.0891" y1="6972.3584" y2="7020.0879"/><polygon fill="#181818" points="6625.0891,7020.0879,6629.0891,7011.0879,6625.0891,7015.0879,6621.0891,7011.0879,6625.0891,7020.0879" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="149.1699" x="2721.89" y="4577.3188">writes per-block buffers</text><g class="legend" data-source-line="14"><rect fill="#DDDDDD" height="670.6387" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="500.5742" x="6371.574" y="8648.125"/><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="139.6172" x="6376.574" y="8666.6875">Target organization:</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="232.9893" x="6520.1287" y="8666.6875">`core` and `tui` are separate crates.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="451.0078" x="6376.574" y="8683.627">`core` has no terminal imports and no `crossterm` / `ui` dependency.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="262.6982" x="6376.574" y="8700.5664">`tui` depends on `core` and `crossterm`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="379.415" x="6376.574" y="8717.5059">`ui` is a terminal UI primitives module inside `tui` (`tui::ui`);</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="173.9404" x="6376.574" y="8734.4453">it depends on `crossterm`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="390.4414" x="6376.574" y="8751.3848">A GUI or web frontend uses `core` directly and ignores `ui`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6376.574" y="8768.3242">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="153.7744" x="6376.574" y="8785.2637">`Buffer` lives in `core`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="215.4277" x="6534.2859" y="8785.2637">It is pure data &#8212; lines, extmarks,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="435.4014" x="6376.574" y="8802.2031">namespaces, undo. Zero terminal deps. Headless reads transcript</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="383.1338" x="6376.574" y="8819.1426">content through the same surface as the TUI does. Parser</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="420.1572" x="6376.574" y="8836.082">*implementations* (markdown / diff / syntax / bash) stay in `tui`</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="381.2471" x="6376.574" y="8853.0215">because they pull from `tui::content::highlight::*` (syntect,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="179.0879" x="6376.574" y="8869.9609">inline markdown, diff LCS).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6376.574" y="8886.9004">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="274.1895" x="6376.574" y="8903.8398">Lua's drawing context is full, not partial.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="91.3145" x="6654.701" y="8903.8398">Tool / dialog /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="423.5342" x="6376.574" y="8920.7793">statusline `render` callbacks receive a `Buffer` userdata with the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="414.9072" x="6376.574" y="8937.7188">full Buffer API (set_lines / add_highlight / set_extmark / attach /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="488.7969" x="6376.574" y="8954.6582">namespaces / virt-text). No `RenderCtx`-style enum-of-allowed-methods.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="406.793" x="6376.574" y="8971.5977">Shipped Rust renderers (smelt.bash.render, smelt.diff.render,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="447.2959" x="6376.574" y="8988.5371">smelt.syntax.render, smelt.notebook.render) sit on top of the Buffer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="251.7334" x="6376.574" y="9005.4766">API as conveniences, not in front of it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6376.574" y="9022.416">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="377.1387" x="6376.574" y="9039.3555">No tool/command/dialog/mode name matching in Rust.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="109.498" x="6757.6502" y="9039.3555">A `match name {</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="397.127" x="6376.574" y="9056.2949">"bash" =&gt; &#8230; }` over a Lua-registered identifier is a bug. The</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="394.502" x="6376.574" y="9073.2344">registration table carries the metadata; Rust calls through it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6376.574" y="9090.1738">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="266.8613" x="6376.574" y="9107.1133">Plugin-author surface (P9.f-y, landed).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="161.7998" x="6647.3728" y="9107.1133">Namespaces are integer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="456.7705" x="6376.574" y="9124.0527">handles minted by `smelt.buf.create_namespace`. Extmark API is one</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="364.6768" x="6376.574" y="9140.9922">keyset call mirroring nvim verbatim (`hl_eol`, `hl_mode`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="336.7588" x="6376.574" y="9157.9316">`virt_text_pos`, gravity, priority, etc.). Plugins live in</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="420.6221" x="6376.574" y="9174.8711">`/.config/smelt/` AND project-local `&lt;cwd&gt;/.smelt/` (trust-gated</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="352.9053" x="6376.574" y="9191.8105">via SHA-256). Tool files auto-register on require. Cell</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="361.8467" x="6376.574" y="9208.75">subscribers see (new, old); user-namespaced cells via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="378.7725" x="6376.574" y="9225.6895">`smelt.cell.user(...)`. `require` searches workspace + user</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="434.0342" x="6376.574" y="9242.6289">runtime before embedded fallback (P9.j). Read-only tools opt into</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="426.9727" x="6376.574" y="9259.5684">parallel execution (P9.k). Permission defaults declared in Lua via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="438.751" x="6376.574" y="9276.5078">`permission_defaults` / `default_allow` (P9.y). Provider middleware</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="52.6094" x="6376.574" y="9293.4473">remains</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="59.6436" x="6433.1209" y="9293.4473">deferred</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="280.6084" x="6496.7019" y="9293.4473">(P9.i &#8212; speculative seam, lands when first</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="158.5596" x="6376.574" y="9310.3867">consumer materializes).</text></g><?plantuml-src jNthSXjNjjv_FCKENNK8KBZOdZak3qGhH