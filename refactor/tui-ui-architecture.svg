 style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="6241.668" x2="6241.668" y1="6543.1357" y2="6675.8652"/><polygon fill="#181818" points="6241.668,6675.8652,6245.668,6666.8652,6241.668,6670.8652,6237.668,6666.8652,6241.668,6675.8652" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="149.1699" x="3685.4995" y="4349.7007">writes per-block buffers</text><g class="legend" data-source-line="14"><rect fill="#DDDDDD" height="670.6387" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="500.5742" x="6356.1665" y="8343.9023"/><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="139.6172" x="6361.1665" y="8362.4648">Target organization:</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="232.9893" x="6504.7212" y="8362.4648">`core` and `tui` are separate crates.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="451.0078" x="6361.1665" y="8379.4043">`core` has no terminal imports and no `crossterm` / `ui` dependency.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="262.6982" x="6361.1665" y="8396.3438">`tui` depends on `core` and `crossterm`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="379.415" x="6361.1665" y="8413.2832">`ui` is a terminal UI primitives module inside `tui` (`tui::ui`);</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="173.9404" x="6361.1665" y="8430.2227">it depends on `crossterm`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="390.4414" x="6361.1665" y="8447.1621">A GUI or web frontend uses `core` directly and ignores `ui`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6361.1665" y="8464.1016">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="153.7744" x="6361.1665" y="8481.041">`Buffer` lives in `core`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="215.4277" x="6518.8784" y="8481.041">It is pure data &#8212; lines, extmarks,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="435.4014" x="6361.1665" y="8497.9805">namespaces, undo. Zero terminal deps. Headless reads transcript</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="383.1338" x="6361.1665" y="8514.9199">content through the same surface as the TUI does. Parser</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="420.1572" x="6361.1665" y="8531.8594">*implementations* (markdown / diff / syntax / bash) stay in `tui`</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="381.2471" x="6361.1665" y="8548.7988">because they pull from `tui::content::highlight::*` (syntect,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="179.0879" x="6361.1665" y="8565.7383">inline markdown, diff LCS).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6361.1665" y="8582.6777">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="274.1895" x="6361.1665" y="8599.6172">Lua's drawing context is full, not partial.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="91.3145" x="6639.2935" y="8599.6172">Tool / dialog /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="423.5342" x="6361.1665" y="8616.5566">statusline `render` callbacks receive a `Buffer` userdata with the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="414.9072" x="6361.1665" y="8633.4961">full Buffer API (set_lines / add_highlight / set_extmark / attach /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="488.7969" x="6361.1665" y="8650.4355">namespaces / virt-text). No `RenderCtx`-style enum-of-allowed-methods.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="406.793" x="6361.1665" y="8667.375">Shipped Rust renderers (smelt.bash.render, smelt.diff.render,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="447.2959" x="6361.1665" y="8684.3145">smelt.syntax.render, smelt.notebook.render) sit on top of the Buffer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="251.7334" x="6361.1665" y="8701.2539">API as conveniences, not in front of it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6361.1665" y="8718.1934">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="377.1387" x="6361.1665" y="8735.1328">No tool/command/dialog/mode name matching in Rust.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="109.498" x="6742.2427" y="8735.1328">A `match name {</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="397.127" x="6361.1665" y="8752.0723">"bash" =&gt; &#8230; }` over a Lua-registered identifier is a bug. The</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="394.502" x="6361.1665" y="8769.0117">registration table carries the metadata; Rust calls through it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="6361.1665" y="8785.9512">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="266.8613" x="6361.1665" y="8802.8906">Plugin-author surface (P9.f-y, landed).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="161.7998" x="6631.9653" y="8802.8906">Namespaces are integer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="456.7705" x="6361.1665" y="8819.8301">handles minted by `smelt.buf.create_namespace`. Extmark API is one</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="364.6768" x="6361.1665" y="8836.7695">keyset call mirroring nvim verbatim (`hl_eol`, `hl_mode`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="336.7588" x="6361.1665" y="8853.709">`virt_text_pos`, gravity, priority, etc.). Plugins live in</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="420.6221" x="6361.1665" y="8870.6484">`/.config/smelt/` AND project-local `&lt;cwd&gt;/.smelt/` (trust-gated</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="352.9053" x="6361.1665" y="8887.5879">via SHA-256). Tool files auto-register on require. Cell</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="361.8467" x="6361.1665" y="8904.5273">subscribers see (new, old); user-namespaced cells via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="378.7725" x="6361.1665" y="8921.4668">`smelt.cell.user(...)`. `require` searches workspace + user</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="434.0342" x="6361.1665" y="8938.4063">runtime before embedded fallback (P9.j). Read-only tools opt into</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="426.9727" x="6361.1665" y="8955.3457">parallel execution (P9.k). Permission defaults declared in Lua via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="438.751" x="6361.1665" y="8972.2852">`permission_defaults` / `default_allow` (P9.y). Provider middleware</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="52.6094" x="6361.1665" y="8989.2246">remains</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="59.6436" x="6417.7134" y="8989.2246">deferred</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="280.6084" x="6481.2944" y="8989.2246">(P9.i &#8212; speculative seam, lands when first</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="158.5596" x="6361.1665" y="9006.1641">consumer materializes).</text></g><?plantuml-src jNthSYDNajv_FCKn5R4Di76HPdOL6ZJL3ZQRxEOEcsJmef76T005e03Ki505LnN8XjHoRFZ7_FTw8lOD_0h-xtsJUHBdbvddKW38qQnR7I4Hg3hNF7dFF8d_j2oYsI8oQRJELvM9q_j6exnFicLKH0ipJgEoFAog8XcjglXqd6VNoO-n-J9eKiwZIVwOP3CpZT8o3juK-IgR7EL55XVcw-3v99v6gxGwoRFgF5h4Pkyqg-9YBsYnZCRtqIo-hjPfR8fuN4NPB8qRysGIctYnhDPc4Iz6SL7M7rNpV58s6bLIKRTo4QUL-Uk__CLKKJ6BAnCLutbIqM2h8ZRDiYfM_B5rbxsDnqcPv5bfecnYYgYYpn4DaIOFiKaoixz_U7Nq_lJc-EZczkgukvZixxyoPVpVLd4sniQvoTNnoU7HpSKLl-us6cayYp5QCfjN3KCDRcGPUJ6BikH7dgI_ls-6uxo8Xpppi5ebz8cMLyO0H1MRCVvVTca0RJUFIfFbXW2sI6YH9baiywAIbTFpuRZ8on9lXwPdXXXl4Yzf8RJKDGzJ-MUboRFQ_BupDqNBX8RsizsUccMHB9AA85EQHJvPfO1GYLEGaPluq-_JnzOh6YEfwdFL9ZWqxsZ0l32FySXC2y87G6nLqj2wgac2qq_NlBnabj73ajT500PCXszMqsbS3FceIXo4TEmIO4yhB7w9qvv4LSIea2PPNBPD_B5QHCLzsQP1CaB1aX0EpmbVywxvOrm40ARbbrtpFeucQLoMX8qHxQKgegmS5yaIHplcXLUccXF6p-RqbmuGY5skYYaDREZ8yEo6DZl9wJJDPLIKSO4TqF6byO9w