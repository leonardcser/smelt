gthAdjust="spacing" textLength="29.25" x="1348.1725" y="476.812">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="8.8677" x="1388.3913" y="476.812">X</text><line style="stroke:#000000;stroke-width:1;" x1="1239.5514" x2="1411.884" y1="448.4888" y2="448.4888"/><line style="stroke:#000000;stroke-width:1;" x1="1239.5514" x2="1411.884" y1="464.2183" y2="464.2183"/><line style="stroke:#000000;stroke-width:1;" x1="1239.5514" x2="1411.884" y1="479.9478" y2="479.9478"/><line style="stroke:#000000;stroke-width:1;" x1="1239.5514" x2="1239.5514" y1="448.4888" y2="479.9478"/><line style="stroke:#000000;stroke-width:1;" x1="1348.1725" x2="1348.1725" y1="448.4888" y2="479.9478"/><line style="stroke:#000000;stroke-width:1;" x1="1377.4225" x2="1377.4225" y1="448.4888" y2="479.9478"/><line style="stroke:#000000;stroke-width:1;" x1="1411.884" x2="1411.884" y1="448.4888" y2="479.9478"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="381.8813" x="1239.5514" y="494.5415">| border / title  |  &#8212;     |   &#8212;    |  ' on LayoutTree (any container)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="348.5688" x="1239.5514" y="510.271">| panel dividers  |  &#8212;     |   &#8212;    |  ' on LayoutTree (parent)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="1239.5514" y="526.0005">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="300.4346" x="1239.5514" y="541.73">Same Buffer can have 0..N Windows looking at it</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="298.6128" x="1239.5514" y="557.4595">with independent cursors/scrolls. No BufferView</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="78.8125" x="1239.5514" y="573.189">middle layer.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="1239.5514" y="588.9185">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.5786" x="1239.5514" y="604.6479">Composing widgets</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="135.4019" x="1366.13" y="604.6479">: a "dialog with a list +</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="77.2891" x="1239.5514" y="620.3774">text input" is</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.0005" x="1320.4967" y="620.3774">N Windows in one Overlay</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="31.0591" x="1487.4972" y="620.3774">. The</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="315.5991" x="1239.5514" y="636.1069">Overlay's `layout` is a Vbox/Hbox of `Leaf(WinId)`s,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="228.3379" x="1239.5514" y="651.8364">with chrome on the Vbox/Hbox itself.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="313.7964" x="1239.5514" y="667.5659">No compound-widget type, no group type &#8212; every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="304.5479" x="1239.5514" y="683.2954">composite shape is N&#215;Window inside an Overlay.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="1239.5514" y="699.0249">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.8149" x="1239.5514" y="714.7544">Rendering model</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="170.3774" x="1347.3664" y="714.7544">: event-driven + diff-based,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="256.915" x="1239.5514" y="730.4839">no dirty flag. The loop renders after every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="288.501" x="1239.5514" y="746.2134">event; the compositor diffs current vs previous</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="279.9697" x="1239.5514" y="761.9429">Grid and flushes only changed cells. Idle CPU</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="275.5835" x="1239.5514" y="777.6724">is zero (loop parks). Things that change over</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="250.0659" x="1239.5514" y="793.4019">time (clock, spinner) drive a `Cell` from a</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="224.9102" x="1239.5514" y="809.1313">timer; the Cell setter wakes the loop.</text></g><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="3553.2448" x2="3553.2448" y1="7932.6396" y2="8010.4043"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="3553.2448" x2="1005.7643" y1="8010.4043" y2="8010.4043"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="1005.7643" x2="1005.7643" y1="8010.4043" y2="8035.4043"/><polygon fill="#888888" points="1005.7643,8035.4043,1009.7643,8026.4043,1005.7643,8030.4043,1001.7643,8026.4043,1005.7643,8035.4043" style="stroke:#888888;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="96.5225" x="3452.7223" y="7995.2686">uses wi