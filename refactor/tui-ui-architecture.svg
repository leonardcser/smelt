x1="348.4487" x2="348.4487" y1="211.0659" y2="447.0083"/><line style="stroke:#000000;stroke-width:1;" x1="457.0698" x2="457.0698" y1="211.0659" y2="447.0083"/><line style="stroke:#000000;stroke-width:1;" x1="502.6714" x2="502.6714" y1="211.0659" y2="447.0083"/><line style="stroke:#000000;stroke-width:1;" x1="560.0161" x2="560.0161" y1="211.0659" y2="447.0083"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="381.8813" x="348.4487" y="461.6021">| border / title  |  &#8212;     |   &#8212;    |  ' on LayoutTree (any container)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="348.5688" x="348.4487" y="477.3315">| panel dividers  |  &#8212;     |   &#8212;    |  ' on LayoutTree (parent)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="348.4487" y="493.061">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="300.4346" x="348.4487" y="508.7905">Same Buffer can have 0..N Windows looking at it</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="298.6128" x="348.4487" y="524.52">with independent cursors/scrolls. No BufferView</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="78.8125" x="348.4487" y="540.2495">middle layer.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="348.4487" y="555.979">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.5786" x="348.4487" y="571.7085">Composing widgets</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="135.4019" x="475.0273" y="571.7085">: a "dialog with a list +</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="77.2891" x="348.4487" y="587.438">text input" is</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.0005" x="429.394" y="587.438">N Windows in one Overlay</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="31.0591" x="596.3945" y="587.438">. The</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="315.5991" x="348.4487" y="603.1675">Overlay's `layout` is a Vbox/Hbox of `Leaf(WinId)`s,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="228.3379" x="348.4487" y="618.897">with chrome on the Vbox/Hbox itself.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="313.7964" x="348.4487" y="634.6265">No compound-widget type, no group type &#8212; every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="304.5479" x="348.4487" y="650.356">composite shape is N&#215;Window inside an Overlay.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="348.4487" y="666.0854">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.8149" x="348.4487" y="681.8149">Rendering model</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="170.3774" x="456.2637" y="681.8149">: event-driven + diff-based,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="256.915" x="348.4487" y="697.5444">no dirty flag. The loop renders after every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="288.501" x="348.4487" y="713.2739">event; the compositor diffs current vs previous</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="279.9697" x="348.4487" y="729.0034">Grid and flushes only changed cells. Idle CPU</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="275.5835" x="348.4487" y="744.7329">is zero (loop parks). Things that change over</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="250.0659" x="348.4487" y="760.4624">time (clock, spinner) drive a `Cell` from a</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="224.9102" x="348.4487" y="776.1919">timer; the Cell setter wakes the loop.</text></g><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="6487.6793" x2="6487.6793" y1="7793.415" y2="7878.1445"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="6487.6793" x2="569.543" y1="7878.1445" y2="7878.1445"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="569.543" x2="569.543" y1="7878.1445" y2="7903.1445"/><polygon fill="#888888" points="569.543,7903.1445,573.543,7894.1445,569.543,7898.1445,565.543,7894.1445,569.543,7903.1445" style="stroke:#888888;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="96.5225" x="6387.1569" y="7843.0088">uses wire types</text><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="6467.6793" x2="6467.6793" y1="7243.8535" y2="7268.8535"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="6467.6793" x2="653.0654" y1="7268.8535" y2="7268.8535"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="653.0654" x2="653.0654" y1="7268.8535" y2="7868.1445"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="653.0654" x2="559.543" y1="7868.1445" y2="7868.1445"/><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="559.543" x2="559.543" y1="7868.1445" y2="7903.1445"/><polygon fill="#88888