0;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="241.1738" y2="241.1738"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="256.9033" y2="256.9033"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="272.6328" y2="272.6328"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="288.3623" y2="288.3623"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="304.0918" y2="304.0918"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="319.8213" y2="319.8213"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="335.5508" y2="335.5508"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="351.2803" y2="351.2803"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="367.0098" y2="367.0098"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="382.7393" y2="382.7393"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="5067.6259" y1="398.4688" y2="398.4688"/><line style="stroke:#000000;stroke-width:1;" x1="4856.0585" x2="4856.0585" y1="162.5264" y2="398.4688"/><line style="stroke:#000000;stroke-width:1;" x1="4964.6796" x2="4964.6796" y1="162.5264" y2="398.4688"/><line style="stroke:#000000;stroke-width:1;" x1="5010.2812" x2="5010.2812" y1="162.5264" y2="398.4688"/><line style="stroke:#000000;stroke-width:1;" x1="5067.6259" x2="5067.6259" y1="162.5264" y2="398.4688"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="381.8813" x="4856.0585" y="413.0625">| border / title  |  &#8212;     |   &#8212;    |  ' on LayoutTree (any container)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="348.5688" x="4856.0585" y="428.792">| panel dividers  |  &#8212;     |   &#8212;    |  ' on LayoutTree (parent)</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="4856.0585" y="444.5215">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="300.4346" x="4856.0585" y="460.251">Same Buffer can have 0..N Windows looking at it</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="298.6128" x="4856.0585" y="475.9805">with independent cursors/scrolls. No BufferView</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="78.8125" x="4856.0585" y="491.71">middle layer.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="4856.0585" y="507.4395">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.5786" x="4856.0585" y="523.1689">Composing widgets</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="135.4019" x="4982.6371" y="523.1689">: a "dialog with a list +</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="77.2891" x="4856.0585" y="538.8984">text input" is</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.0005" x="4937.0038" y="538.8984">N Windows in one Overlay</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="31.0591" x="5104.0043" y="538.8984">. The</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="315.5991" x="4856.0585" y="554.6279">Overlay's `layout` is a Vbox/Hbox of `Leaf(WinId)`s,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="228.3379" x="4856.0585" y="570.3574">with chrome on the Vbox/Hbox itself.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="313.7964" x="4856.0585" y="586.0869">No compound-widget type, no group type &#8212; every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="304.5479" x="4856.0585" y="601.8164">composite shape is N&#215;Window inside an Overlay.</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="4856.0585" y="617.5459">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.8149" x="4856.0585" y="633.2754">Rendering model</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="170.3774" x="4963.8735" y="633.2754">: event-driven + diff-based,</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="256.915" x="4856.0585" y="649.0049">no dirty flag. The loop renders after every</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="288.501" x="4856.0585" y="664.7344">event; the compositor diffs current vs previous</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="279.9697" x="4856.0585" y="680.4639">Grid and flushes only changed cells. Idle CPU</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="275.5835" x="4856.0585" y="696.1934">is zero (loop parks). Things that change over</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="250.0659" x="4856.0585" y="711.9229">time (clock, spinner) drive a `Cell` from a</text><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="224.9102" x="4856.0585" y="727.6523">timer; the Cell setter wakes the loop.</text></g><line style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;" x1="2495.1834" x2="2495.1834" y1="8127.6377" y2="8142.6377"/><line 