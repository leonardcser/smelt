"4746.0068"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="4097.0797" x2="3898.1754" y1="4746.0068" y2="4746.0068"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3898.1754" x2="3898.1754" y1="4746.0068" y2="4871.4658"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3898.1754" x2="1685.3294" y1="4871.4658" y2="4871.4658"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1685.3294" x2="1685.3294" y1="4871.4658" y2="4929.1953"/><polygon fill="#181818" points="1685.3294,4929.1953,1689.3294,4920.1953,1685.3294,4924.1953,1681.3294,4920.1953,1685.3294,4929.1953" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="141.8701" x="3752.3053" y="4808.4653">writes lines + extmarks</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3968.7997" x2="3968.7997" y1="4626.0068" y2="4736.0068"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3968.7997" x2="3739.3053" y1="4736.0068" y2="4736.0068"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3739.3053" x2="3739.3053" y1="4736.0068" y2="4861.4658"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3739.3053" x2="1678.0059" y1="4861.4658" y2="4861.4658"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1678.0059" x2="1678.0059" y1="4861.4658" y2="4929.1953"/><polygon fill="#181818" points="1678.0059,4929.1953,1682.0059,4920.1953,1678.0059,4924.1953,1674.0059,4920.1953,1678.0059,4929.1953" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="141.8701" x="3593.4352" y="4808.4653">writes lines + extmarks</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3580.4352" x2="3580.4352" y1="4626.0068" y2="4851.4658"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="3580.4352" x2="1670.6825" y1="4851.4658" y2="4851.4658"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" x1="1670.6825" x2="1670.6825" y1="4851.4658" y2="4929.1953"/><polygon fill="#181818" points="1670.6825,4929.1953,1674.6825,4920.1953,1670.6825,4924.1953,1666.6825,4920.1953,1670.6825,4929.1953" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter'" font-size="13" lengthAdjust="spacing" textLength="149.1699" x="3427.2652" y="4808.4653">writes per-block buffers</text><g class="legend" data-source-line="14"><rect fill="#DDDDDD" height="958.6094" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="501.1689" x="7922.1983" y="8476.1621"/><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="226.2354" x="7927.1983" y="8494.7246">Target organization (post P12.A):</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="434.8477" x="7927.1983" y="8511.6641">- `core` &#8212; frontend-agnostic; no terminal imports, no `crossterm`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="169.7021" x="7935.0733" y="8528.6035">no editor / renderer deps.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="411.585" x="7927.1983" y="8545.543">- `smelt-buffer` &#8212; shared data layer: `Buffer`, extmarks, undo,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="380.748" x="7935.0733" y="8562.4824">`Theme`, `Style`, `Color`, clipboard, attachments. Both the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="405.877" x="7935.0733" y="8579.4219">renderer and editor depend on it; pure data, no terminal calls.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="404.8857" x="7927.1983" y="8596.3613">- `smelt-term` &#8212; pure terminal renderer: `Grid`, `Compositor`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="454.6924" x="7935.0733" y="8613.3008">`LayoutTree&lt;PaintId&gt;`, `flush_diff`, chrome paint, `paint_layout_tree`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="435.2646" x="7935.0733" y="8630.2402">No `Window`, no vim, no editor concepts. Standalone; usable as a</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="177.4883" x="7935.0733" y="8647.1797">TUI library (e.g. by `tcloc`).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="377.1113" x="7927.1983" y="8664.1191">- `smelt-edit` &#8212; editor layer over `smelt-term`: `Window`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="432.9473" x="7935.0733" y="8681.0586">`DrawContext`, `Buffer` dispatch, vim modes, callbacks, overlays,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="422.29" x="7935.0733" y="8697.998">focus + capture + click-tracking. The `Ui` struct ties windows to</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="448.916" x="7935.0733" y="8714.9375">layout and routes events; its renderer is a `smelt_term::Compositor`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="388.6094" x="7927.1983" y="8731.877">- `tui` &#8212; terminal frontend; depends on `core`, `smelt-edit`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="439.8584" x="7935.0733" y="8748.8164">`smelt-buffer`, `smelt-term`, and `crossterm`. Owns `PaintRegistry`</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="409.4316" x="7935.0733" y="8765.7559">(Lua-side `smelt.paint` dispatch) and `TuiApp::resolve_leaf_id`</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="483.2939" x="7935.0733" y="8782.6953">which maps raw `u64` paint ids to `LeafKind::Window` / `LeafKind::Paint`.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="397.7285" x="7927.1983" y="8799.6348">- `engine` / `protocol` &#8212; unchanged; LLM core + wire types.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="7927.1983" y="8816.5742">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="361.7646" x="7927.1983" y="8833.5137">A GUI or web frontend uses `core` directly and ignores</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="458.4111" x="7927.1983" y="8850.4531">`smelt-{term,edit}`. A non-editor TUI consumer (treemap, dashboard)</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="367.5273" x="7927.1983" y="8867.3926">uses `smelt-term` directly with its own paint dispatcher.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="7927.1983" y="8884.332">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="205.3857" x="7927.1983" y="8901.2715">`Buffer` lives in `smelt-buffer`</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="149.0029" x="8136.5216" y="8901.2715">(was: `core`). It is pure</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="419.9658" x="7927.1983" y="8918.2109">data &#8212; lines, extmarks, namespaces, undo. Zero terminal deps.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="442.2441" x="7927.1983" y="8935.1504">Headless reads transcript content through the same surface as the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="417.0264" x="7927.1983" y="8952.0898">TUI does. Parser *implementations* (markdown / diff / syntax /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="269.4727" x="7927.1983" y="8969.0293">bash) stay in `tui` because they pull from</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="408.4678" x="7927.1983" y="8985.9688">`tui::content::highlight::*` (syntect, inline markdown, diff LCS).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="7927.1983" y="9002.9082">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="274.1895" x="7927.1983" y="9019.8477">Lua's drawing context is full, not partial.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="91.3145" x="8205.3253" y="9019.8477">Tool / dialog /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="423.5342" x="7927.1983" y="9036.7871">statusline `render` callbacks receive a `Buffer` userdata with the</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="414.9072" x="7927.1983" y="9053.7266">full Buffer API (set_lines / add_highlight / set_extmark / attach /</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="488.7969" x="7927.1983" y="9070.666">namespaces / virt-text). No `RenderCtx`-style enum-of-allowed-methods.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="406.793" x="7927.1983" y="9087.6055">Shipped Rust renderers (smelt.bash.render, smelt.diff.render,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="447.2959" x="7927.1983" y="9104.5449">smelt.syntax.render, smelt.notebook.render) sit on top of the Buffer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="251.7334" x="7927.1983" y="9121.4844">API as conveniences, not in front of it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="7927.1983" y="9138.4238">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="377.1387" x="7927.1983" y="9155.3633">No tool/command/dialog/mode name matching in Rust.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="109.498" x="8308.2745" y="9155.3633">A `match name {</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="397.127" x="7927.1983" y="9172.3027">"bash" =&gt; &#8230; }` over a Lua-registered identifier is a bug. The</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="394.502" x="7927.1983" y="9189.2422">registration table carries the metadata; Rust calls through it.</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="7927.1983" y="9206.1816">&#160;</text><text fill="#000000" font-family="'Inter'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="266.8613" x="7927.1983" y="9223.1211">Plugin-author surface (P9.f-y, landed).</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="161.7998" x="8197.9972" y="9223.1211">Namespaces are integer</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="456.7705" x="7927.1983" y="9240.0605">handles minted by `smelt.buf.create_namespace`. Extmark API is one</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="364.6768" x="7927.1983" y="9257">keyset call mirroring nvim verbatim (`hl_eol`, `hl_mode`,</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="336.7588" x="7927.1983" y="9273.9395">`virt_text_pos`, gravity, priority, etc.). Plugins live in</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="420.6221" x="7927.1983" y="9290.8789">`/.config/smelt/` AND project-local `&lt;cwd&gt;/.smelt/` (trust-gated</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="352.9053" x="7927.1983" y="9307.8184">via SHA-256). Tool files auto-register on require. Cell</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="361.8467" x="7927.1983" y="9324.7578">subscribers see (new, old); user-namespaced cells via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="378.7725" x="7927.1983" y="9341.6973">`smelt.cell.user(...)`. `require` searches workspace + user</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="434.0342" x="7927.1983" y="9358.6367">runtime before embedded fallback (P9.j). Read-only tools opt into</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="426.9727" x="7927.1983" y="9375.5762">parallel execution (P9.k). Permission defaults declared in Lua via</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="438.751" x="7927.1983" y="9392.5156">`permission_defaults` / `default_allow` (P9.y). Provider middleware</text><text fill="#000000" font-family="'Inter'" font-size="14" lengthAdjust="spacing" textLength="52.6094" x="7927.1983" y="9409.4551">remains</text><text fill="#000000" font-family="'Inter