[package]
name = "smelt-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
smelt-tui = { path = "../crates/tui", features = ["harness"] }
smelt-core = { path = "../crates/core" }
smelt-buffer = { path = "../crates/buffer" }
smelt-style = { path = "../crates/style" }
smelt-term = { path = "../crates/term" }
smelt-protocol = { path = "../crates/protocol" }
smelt-engine = { path = "../crates/engine", features = ["fuzz"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt"] }
unicode-width = "0.2"

[[bin]]
name = "smelt_loop"
path = "fuzz_targets/smelt_loop.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_ops"
path = "fuzz_targets/text_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lua_loop"
path = "fuzz_targets/lua_loop.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attached_ops"
path = "fuzz_targets/attached_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_invariance"
path = "fuzz_targets/cache_invariance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openai_cache_invariance"
path = "fuzz_targets/openai_cache_invariance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_roundtrip"
path = "fuzz_targets/snapshot_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grid_invariants"
path = "fuzz_targets/grid_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ansi_parser"
path = "fuzz_targets/ansi_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crash_to_scenario"
path = "src/bin/crash_to_scenario.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_scenario"
path = "src/bin/replay_scenario.rs"
test = false
doc = false
bench = false

[[bin]]
name = "play_scenario"
path = "src/bin/play_scenario.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shrink_scenario"
path = "src/bin/shrink_scenario.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
lto = true
codegen-units = 1

[profile.release.build-override]
opt-level = 0
