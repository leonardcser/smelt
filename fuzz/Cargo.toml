[package]
name = "smelt-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
tui = { path = "../crates/tui" }
smelt-buffer = { path = "../crates/buffer" }
smelt-style = { path = "../crates/style" }
protocol = { path = "../crates/protocol" }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt"] }

[[bin]]
name = "smelt_loop"
path = "fuzz_targets/smelt_loop.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_ops"
path = "fuzz_targets/text_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lua_loop"
path = "fuzz_targets/lua_loop.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crash_to_scenario"
path = "src/bin/crash_to_scenario.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_scenario"
path = "src/bin/replay_scenario.rs"
test = false
doc = false
bench = false

[[bin]]
name = "play_scenario"
path = "src/bin/play_scenario.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
lto = true
codegen-units = 1

[profile.release.build-override]
opt-level = 0
