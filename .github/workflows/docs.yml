name: Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "crates/core/src/config.rs"
      - "crates/core/src/lua/**"
      - "crates/tui/src/lua/**"
      - "crates/xtask/src/gen_lua_docs.rs"
      - "runtime/lua/smelt/**"
  # A finished release adds its version to the selector. This runs on main,
  # which the Pages environment deploys from.
  workflow_run:
    workflows: [Release]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "crates/core/src/config.rs"
      - "crates/core/src/lua/**"
      - "crates/tui/src/lua/**"
      - "crates/xtask/src/gen_lua_docs.rs"
      - "runtime/lua/smelt/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Every release tag builds its own version of the docs.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install zensical
        run: pip install zensical==0.0.50

      - name: Build docs for main and every release
        run: python3 docs/build_versions.py

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
