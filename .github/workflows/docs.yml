name: Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "crates/core/src/config.rs"
      - "crates/core/src/lua/**"
      - "crates/tui/src/lua/**"
      - "crates/xtask/src/gen_lua_docs.rs"
      - "runtime/lua/smelt/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "crates/core/src/config.rs"
      - "crates/core/src/lua/**"
      - "crates/tui/src/lua/**"
      - "crates/xtask/src/gen_lua_docs.rs"
      - "runtime/lua/smelt/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install zensical
        run: pip install zensical==0.0.50

      - name: Build docs
        run: cd docs && zensical build --strict

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
