name: Publish library crate

# Publishes an independently versioned library crate declared in
# `[workspace.metadata.smelt.release]` to crates.io.
#
# Trigger by pushing a tag of the form `<crate>-v<version>`.
#
# Auth uses crates.io Trusted Publishing (OIDC). No long-lived token
# secret is required; configure the trusted publisher entry on
# crates.io for each crate, pointing at this repo + workflow.

on:
  push:
    tags:
      - "smelt-*-v*"

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Parse and verify tag
        id: parse
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG##*-v}"
          CRATE="${TAG%-v${VERSION}}"
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          git tag --points-at HEAD | grep -Fx "$TAG"
          cargo metadata --locked --no-deps --format-version 1 > /tmp/cargo-metadata.json
          ACTUAL_VERSION=$(python3 - "$CRATE" <<'PY'
          import json
          import sys

          crate = sys.argv[1]
          with open("/tmp/cargo-metadata.json", encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          independent = set(
              metadata["metadata"]["smelt"]["release"]["independent-crates"]
          )
          if crate not in independent:
              raise SystemExit(f"unsupported release crate: {crate}")
          matches = [
              package["version"]
              for package in metadata["packages"]
              if package["name"] == crate
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one workspace package named {crate}, found {len(matches)}")
          print(matches[0])
          PY
          )
          test "$ACTUAL_VERSION" = "$VERSION" || {
            echo "tag version $VERSION does not match $CRATE package version $ACTUAL_VERSION" >&2
            exit 1
          }
          git diff --exit-code
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing crate=$CRATE version=$VERSION"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run lints
        run: cargo clippy --locked -p "${{ steps.parse.outputs.crate }}" --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run --locked -p "${{ steps.parse.outputs.crate }}" --no-tests pass

      - name: Verify packaging
        run: cargo publish --locked -p "${{ steps.parse.outputs.crate }}" --dry-run

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p "${{ steps.parse.outputs.crate }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: |
            Published [`${{ steps.parse.outputs.crate }} v${{ steps.parse.outputs.version }}`](https://crates.io/crates/${{ steps.parse.outputs.crate }}/${{ steps.parse.outputs.version }}) to crates.io.

            ```toml
            ${{ steps.parse.outputs.crate }} = "${{ steps.parse.outputs.version }}"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
