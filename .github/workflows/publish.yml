name: Publish library crate

# Publishes one of the independently-versioned library crates
# (smelt-perf, smelt-style, smelt-term) to crates.io.
#
# Trigger by pushing a tag of the form `<crate>-v<version>`, e.g.:
#   git tag smelt-perf-v0.1.0 && git push origin smelt-perf-v0.1.0
#   git tag smelt-style-v0.1.0 && git push origin smelt-style-v0.1.0
#   git tag smelt-term-v0.1.0 && git push origin smelt-term-v0.1.0
#
# Auth uses crates.io Trusted Publishing (OIDC). No long-lived token
# secret is required; configure the trusted publisher entry on
# crates.io for each crate, pointing at this repo + workflow.

on:
  push:
    tags:
      - "smelt-perf-v*"
      - "smelt-style-v*"
      - "smelt-term-v*"

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG##*-v}"
          CRATE="${TAG%-v${VERSION}}"
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing crate=$CRATE version=$VERSION"

      - name: Bump version
        run: |
          cargo set-version -p "${{ steps.parse.outputs.crate }}" "${{ steps.parse.outputs.version }}"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run lints
        run: cargo clippy -p "${{ steps.parse.outputs.crate }}" --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run -p "${{ steps.parse.outputs.crate }}"

      - name: Verify packaging
        run: cargo publish -p "${{ steps.parse.outputs.crate }}" --dry-run

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "${{ steps.parse.outputs.crate }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          if git diff --staged --quiet; then
            echo "No version bump to commit"
          else
            git commit -m "chore: publish ${{ steps.parse.outputs.crate }} v${{ steps.parse.outputs.version }}"
            git push origin main
          fi
          # Re-tag against the new commit so the tag points at the published state.
          git tag -f "${GITHUB_REF_NAME}"
          git push -f origin "${GITHUB_REF_NAME}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: |
            Published [`${{ steps.parse.outputs.crate }} v${{ steps.parse.outputs.version }}`](https://crates.io/crates/${{ steps.parse.outputs.crate }}/${{ steps.parse.outputs.version }}) to crates.io.

            ```toml
            ${{ steps.parse.outputs.crate }} = "${{ steps.parse.outputs.version }}"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
