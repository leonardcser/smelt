name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        run: rustup toolchain install

      - name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          test -z "$(git status --porcelain)"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Materialize release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cargo xtask prepare-release "$VERSION"
          cargo metadata --locked --no-deps --format-version 1 > /tmp/cargo-metadata.json
          cargo metadata --locked --no-deps --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
          python3 - "$VERSION" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          with open("/tmp/cargo-metadata.json", encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          independent = set(
              metadata["metadata"]["smelt"]["release"]["independent-crates"]
          )
          mismatches = [
              f"{package['name']}={package['version']}"
              for package in metadata["packages"]
              if package["name"] not in independent and package["version"] != expected
          ]
          if mismatches:
              raise SystemExit(
                  f"runner version {expected} does not match workspace packages: "
                  + ", ".join(mismatches)
              )
          PY

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run lints
        run: cargo clippy --locked --workspace --all-targets --features smelt-tui/harness -- -D warnings

      - name: Build
        run: cargo build --locked --workspace

      - name: Run tests
        run: cargo nextest run --locked --workspace --features smelt-tui/harness

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: smelt-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: smelt-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: smelt-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: smelt-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: smelt-x86_64-pc-windows-msvc.tar.gz

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Verify build source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
          git tag --points-at HEAD | grep -Fx "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain)"

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Materialize release version
        shell: bash
        run: cargo xtask prepare-release "${GITHUB_REF_NAME#v}"

      - name: Build release binary
        env:
          SMELT_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo build --locked --profile dist --bin smelt --target ${{ matrix.target }}

      - name: Smoke-test native binary identity
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          EXPECTED="smelt v${GITHUB_REF_NAME#v}"
          ACTUAL="$(target/${{ matrix.target }}/dist/smelt --version)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "expected '$EXPECTED', got '$ACTUAL'" >&2
            exit 1
          }

      - name: Package binary
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp target/${{ matrix.target }}/dist/smelt "$STAGE/smelt"
          cp LICENSE README.md "$STAGE/"
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME"
            echo "commit=$(git rev-parse HEAD)"
            echo "target=${{ matrix.target }}"
          } > "$STAGE/BUILD_INFO"
          tar -C "$STAGE" -czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}" smelt LICENSE README.md BUILD_INFO

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/dist/smelt.exe" "$stage/smelt.exe"
          Copy-Item LICENSE, README.md $stage
          $commit = git rev-parse HEAD
          @(
            "version=$($env:GITHUB_REF_NAME -replace '^v', '')"
            "tag=$env:GITHUB_REF_NAME"
            "commit=$commit"
            "target=${{ matrix.target }}"
          ) | Set-Content "$stage/BUILD_INFO"
          $archive = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.artifact }}"
          tar -C $stage -czf $archive smelt.exe LICENSE README.md BUILD_INFO

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release source
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
          git tag --points-at HEAD | grep -Fx "$GITHUB_REF_NAME"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="$GITHUB_SHA"
          else
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
          fi

          print_section() {
            local title="$1"
            local pattern="$2"
            local commits=$(git log --pretty=format:"%h %s" $RANGE | grep -E "^[a-f0-9]+ ${pattern}" | sed 's/^/- /' || true)
            if [ -n "$commits" ]; then
              echo "## $title"
              echo "$commits"
              echo ""
            fi
          }

          {
            echo 'body<<EOF'
            print_section "Breaking Changes" "[a-z]+(\(.+\))?!:"
            print_section "Features" "feat(\(.+\))?:"
            print_section "Bug Fixes" "fix(\(.+\))?:"
            print_section "Other Changes" "(refactor|docs|perf|chore|test|ci|revert)(\(.+\))?:"
            echo ""
            echo "## Install"
            echo ""
            echo "Download the prebuilt archive for your platform below and verify it with SHA256SUMS."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect and checksum binaries
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t ARCHIVES < <(find artifacts -type f -name 'smelt-*.tar.gz' | sort)
          test "${#ARCHIVES[@]}" -eq 5 || {
            echo "expected 5 release archives, found ${#ARCHIVES[@]}" >&2
            exit 1
          }
          cp "${ARCHIVES[@]}" release/
          (cd release && sha256sum smelt-*.tar.gz > SHA256SUMS)

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          body: ${{ steps.notes.outputs.body }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
