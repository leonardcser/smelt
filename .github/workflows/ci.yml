name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  pr-title:
    name: Validate PR Title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check conventional commit format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Run tests with coverage floor
        run: cargo llvm-cov nextest --workspace --fail-under-lines 65

      - name: Check Lua API docs are in sync
        run: |
          cargo xtask gen-lua-docs
          git diff --exit-code -- docs/docs/reference/api runtime/lua/smelt/_meta docs/zensical.toml \
            || (echo "::error::Generated Lua API docs are out of date. Run 'cargo xtask gen-lua-docs' and commit." && exit 1)

  fuzz-regression:
    name: Fuzz regression replay
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Replay regression seeds
        run: cargo xtask fuzz replay-regression
