[package]
name = "smelt-term"
version = "0.3.0"
edition = "2021"
description = "Terminal rendering library: Grid, Compositor, LayoutTree, diff-flush renderer."
license = "MIT"
repository = "https://github.com/leonardcser/smelt"
readme = "README.md"
keywords = ["terminal", "tui", "rendering", "compositor", "layout"]
categories = ["command-line-interface", "graphics"]
exclude = ["tests/**"]

[lib]
name = "smelt_term"
path = "src/lib.rs"

[dependencies]
smelt-style = { workspace = true }
smelt-ansi = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
