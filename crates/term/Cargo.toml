[package]
name = "smelt-term"
version = "0.5.0-alpha.2"
edition = "2021"
description = "Terminal rendering library: Grid + Compositor + LayoutTree + Window + Overlay + diff-flush renderer."
license = "MIT"
repository = "https://github.com/leonardcser/smelt"

[lib]
name = "smelt_term"
path = "src/lib.rs"

[dependencies]
smelt-style = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
