[package]
name = "smelt-buffer"
version = "0.5.0-alpha.12"
edition = "2021"
rust-version.workspace = true
description = "Frontend-neutral document model - Buffer (text + extmarks + decorations), Style, Theme, undo, clipboard, attachments. Shared between headless runtimes and the smelt-term renderer."
license = "MIT"
repository = "https://github.com/leonardcser/smelt"

[lib]
name = "smelt_buffer"
path = "src/lib.rs"

[dependencies]
smelt-style = { workspace = true }
smelt-perf = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
unicode-segmentation = "=1.12.0"

[dev-dependencies]
tempfile.workspace = true
