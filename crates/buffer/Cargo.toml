[package]
name = "smelt-buffer"
version = "0.5.0-alpha.2"
edition = "2021"
description = "Frontend-neutral document model — Buffer (text + extmarks + decorations), Style, Theme, undo, clipboard, attachments. Shared between headless runtimes and the smelt-term renderer."
license = "MIT"
repository = "https://github.com/leonardcser/smelt"

[lib]
name = "smelt_buffer"
path = "src/lib.rs"

[dependencies]
smelt-style = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
