[package]
name = "smelt-ui-data"
version = "0.4.7"
edition = "2021"
description = "Pure-data UI primitives — Buffer, Style, Theme, Clipboard — shared between headless runtimes and terminal frontends."
license = "MIT"
repository = "https://github.com/leonardcser/smelt"

[lib]
name = "ui_data"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
sha2 = "0.10"
unicode-width = "0.1"
