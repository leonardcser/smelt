[package]
name = "smelt-core"
version = "0.0.0-dev"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
smelt-transcript = { workspace = true }
smelt-paths = { workspace = true }
smelt-text = { workspace = true }
smelt-permissions = { workspace = true }
smelt-worktree = { workspace = true }
smelt-protocol = { workspace = true }
smelt-engine = { workspace = true }
smelt-provider = { workspace = true }
smelt-perf = { workspace = true }
smelt-buffer = { workspace = true }
smelt-ansi = { workspace = true }
smelt-lua-doc-derive = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "io-util", "process", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process"] }
sha2 = { workspace = true }
libc = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
mlua = { workspace = true }
scraper = "0.29.0"
ego-tree = "0.11"
include_dir = "0.7"
neo_frizbee = { version = "0.13.3", features = ["safe_read"] }
notify = { workspace = true }
smelt-store = { workspace = true }
chrono = "0.4.45"
brush-parser = "0.4.0"
scoped-tls-hkt = "0.1.5"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
atomic-write-file = "0.3.1"
tempfile.workspace = true
mimalloc = "0.1.52"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
smelt-store-v07 = { git = "https://github.com/leonardcser/smelt", tag = "v0.7.0", version = "0.0.0-dev", package = "smelt-store" }

# musl's malloc maps and unmaps large blocks on every call. Overriding the C
# allocator routes bundled C libraries such as SQLite through mimalloc too.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", features = ["override"] }

[dev-dependencies]
smelt-store = { workspace = true }
smelt-test-support = { workspace = true }

[build-dependencies]
mlua.workspace = true
