[package]
name = "smelt-tui"
version = "0.5.0-alpha.5"
edition = "2021"
build = "build.rs"

[lib]
name = "tui"

[dependencies]
smelt-protocol = { workspace = true }
smelt-engine = { workspace = true }
smelt-core = { workspace = true }
smelt-perf = { workspace = true }
smelt-buffer = { workspace = true }
smelt-term = { workspace = true }
smelt-edit = { workspace = true }
smelt-lua-doc-derive = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "io-util", "process", "signal"] }
crossterm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
unicode-width = { workspace = true }
glob = { workspace = true }
futures-core = { workspace = true }
mlua = { workspace = true }
tempfile = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[features]
# Expose the in-process `TestApp` harness (and the few `pub(crate)`
# accessors stories use to reach into app/lua state). On by default so
# the integration test crate under `tests/storybook` and the
# `examples/stories.rs` viewer compile without extra flags; release
# binaries opt out via `default-features = false`.
default = ["harness"]
harness = []

