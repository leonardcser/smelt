[package]
name = "smelt-tui"
version = "0.5.0-alpha.5"
edition = "2021"
build = "build.rs"

[lib]
name = "tui"

[dependencies]
smelt-protocol = { workspace = true }
smelt-engine = { workspace = true }
smelt-core = { workspace = true }
smelt-store = { workspace = true }
smelt-perf = { workspace = true }
smelt-buffer = { workspace = true }
smelt-term = { workspace = true }
smelt-edit = { workspace = true }
smelt-lua-doc-derive = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "io-util", "net", "process", "signal"] }
crossterm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
unicode-width = { workspace = true }
glob = { workspace = true }
futures-core = { workspace = true }
mlua = { workspace = true }
tempfile = { workspace = true }
notify = { workspace = true }
bincode = "1"

[dev-dependencies]
insta = { workspace = true }

[features]
# Expose the in-process `TestApp` harness (and the few `pub(crate)`
# accessors stories use to reach into app/lua state). Release and normal
# workspace builds keep this off; tests, storybook, and examples that need it
# opt in explicitly.
default = []
harness = []

