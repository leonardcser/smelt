<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smelt Session Inspector</title>
<style>
:root { --bg:#0b0c0f; --panel:#15171c; --border:#2a2e37; --text:#d8dee9; --muted:#6b7280; --accent:#81a1c1; --ok:#a3be8c; --warn:#ebcb8b; --err:#bf616a; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
header { padding:1rem 1.25rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:1rem; }
header h1 { margin:0; font-size:1.1rem; color:var(--accent); }
header nav a { color:var(--text); text-decoration:none; }
header nav a:hover { text-decoration:underline; }
main { display:flex; height:calc(100vh - 60px); }
#sidebar { width:320px; border-right:1px solid var(--border); overflow:auto; background:var(--panel); }
#detail { flex:1; overflow:auto; padding:1.25rem; }
.session-item { padding:.75rem 1rem; border-bottom:1px solid var(--border); cursor:pointer; }
.session-item:hover, .session-item.active { background:rgba(129,161,193,.12); }
.session-item .title { font-weight:600; }
.session-item .meta { font-size:.8rem; color:var(--muted); }
.card { background:var(--panel); border:1px solid var(--border); border-radius:6px; margin-bottom:1rem; overflow:hidden; }
.card h3 { margin:0; padding:.75rem 1rem; font-size:.9rem; border-bottom:1px solid var(--border); background:rgba(255,255,255,.02); }
.card .body { padding:1rem; }
pre { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:.75rem; overflow:auto; font-size:.85rem; margin:0; }
.json { white-space:pre-wrap; word-break:break-word; }
.timeline { display:flex; flex-direction:column; gap:.75rem; }
.turn, .request { border:1px solid var(--border); border-radius:6px; padding:.75rem; background:var(--panel); }
.turn header, .request header { display:flex; justify-content:space-between; padding:0; border:0; margin-bottom:.5rem; }
.tag { font-size:.7rem; text-transform:uppercase; padding:.15rem .4rem; border-radius:3px; background:var(--border); color:var(--muted); }
.tag.turn { background:#3b4252; color:#d8dee9; }
.tag.ask { background:#434c5e; color:#d8dee9; }
.tag.error { background:var(--err); color:#fff; }
.tabs { display:flex; gap:.25rem; border-bottom:1px solid var(--border); margin-bottom:.75rem; }
.tab { padding:.4rem .8rem; cursor:pointer; border-bottom:2px solid transparent; }
.tab.active { border-color:var(--accent); color:var(--accent); }
.empty { color:var(--muted); padding:2rem; text-align:center; }
</style>
</head>
<body>
<header><h1>Smelt Inspector</h1><nav><a href="#/">Sessions</a></nav></header>
<main>
  <aside id="sidebar"><div class="empty">Loading sessions…</div></aside>
  <section id="detail"><div class="empty">Select a session to inspect.</div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmtDate = ms => ms ? new Date(ms).toLocaleString() : '—';
const fmtBytes = n => n == null ? '—' : `${n} B`;

let sessions = [];

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

function renderSidebar() {
  const el = $('sidebar');
  if (!sessions.length) { el.innerHTML = '<div class="empty">No sessions found.</div>'; return; }
  const hash = location.hash;
  el.innerHTML = sessions.map(s => {
    const active = hash === `#session/${s.id}` ? 'active' : '';
    const title = s.title || s.first_user_message || s.id.slice(0, 12);
    return `<div class="session-item ${active}" onclick="navigate('session/${s.id}')">
      <div class="title">${escapeHtml(title)}</div>
      <div class="meta">${fmtDate(s.updated_at_ms)} · ${s.mode || 'normal'} · ${fmtBytes(s.text_bytes)}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function jsonBlock(obj) {
  return `<pre class="json">${escapeHtml(JSON.stringify(obj, null, 2))}</pre>`;
}

function tabs(id, items) {
  const buttons = items.map((it, i) => `<div class="tab ${i===0?'active':''}" data-tab="${id}-${i}" onclick="switchTab('${id}', ${i})">${it.label}</div>`).join('');
  const bodies = items.map((it, i) => `<div class="tab-body" id="${id}-${i}" style="${i===0?'':'display:none'}">${it.body}</div>`).join('');
  return `<div class="tabs">${buttons}</div>${bodies}`;
}

function switchTab(group, idx) {
  document.querySelectorAll(`[data-tab^="${group}-"]`).forEach(t => t.classList.remove('active'));
  document.querySelectorAll(`[id^="${group}-"]`).forEach(b => b.style.display = 'none');
  document.querySelector(`[data-tab="${group}-${idx}"]`).classList.add('active');
  $(`${group}-${idx}`).style.display = 'block';
}

async function renderSession(id) {
  const [session, requests] = await Promise.all([
    api(`/api/sessions/${id}`),
    api(`/api/sessions/${id}/requests`).catch(() => [])
  ]);
  const history = session.history || [];
  const historyEl = history.length ? history.map((item, i) => {
    const role = Object.keys(item)[0];
    const data = item[role];
    return `<div class="turn">
      <header><span class="tag turn">${role}</span><span>#${i}</span></header>
      ${jsonBlock(data)}
    </div>`;
  }).join('') : '<div class="empty">No history.</div>';

  const requestsEl = requests.length ? requests.map((r, i) => {
    const tag = r.error ? '<span class="tag error">error</span>' : `<span class="tag ${r.background?'ask':'turn'}">${r.kind}</span>`;
    const body = tabs(`req-${i}`, [
      { label: 'Body', body: jsonBlock(r.body) },
      { label: 'Messages', body: jsonBlock(r.messages) },
      { label: 'Tools', body: jsonBlock(r.tools) },
      { label: 'Response', body: jsonBlock(r.response) },
      { label: 'Usage', body: jsonBlock({ usage: r.usage, cost_usd: r.cost_usd, tokens_per_sec: r.tokens_per_sec, elapsed_ms: r.elapsed_ms }) },
    ]);
    return `<div class="request">
      <header><div>${tag} <strong>${escapeHtml(r.provider_kind)} · ${escapeHtml(r.model)}</strong> · attempt ${r.attempt}</div><span>${fmtDate(r.timestamp_ms)}</span></header>
      <div><strong>URL:</strong> ${escapeHtml(r.url)}</div>
      ${body}
    </div>`;
  }).join('') : '<div class="empty">No request log.</div>';

  $('detail').innerHTML = `
    <div class="card"><h3>Session</h3><div class="body">${jsonBlock(session)}</div></div>
    <div class="card"><h3>History (${history.length})</h3><div class="body timeline">${historyEl}</div></div>
    <div class="card"><h3>Requests (${requests.length})</h3><div class="body timeline">${requestsEl}</div></div>
  `;
}

function navigate(path) {
  location.hash = '#' + path;
  route();
}

async function route() {
  const hash = location.hash.slice(1);
  if (!hash || hash === '/') {
    $('detail').innerHTML = '<div class="empty">Select a session to inspect.</div>';
  } else if (hash.startsWith('session/')) {
    await renderSession(hash.slice('session/'.length));
  }
  renderSidebar();
}

async function init() {
  sessions = await api('/api/sessions');
  renderSidebar();
  route();
}

window.addEventListener('hashchange', route);
window.switchTab = switchTab;
window.navigate = navigate;
init().catch(e => { $('detail').innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`; });
</script>
</body>
</html>
