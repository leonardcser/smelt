[package]
name = "smelt-engine"
version = "0.5.0-alpha.8"
edition = "2021"

[lib]
name = "engine"

[dependencies]
smelt-protocol = { workspace = true }
smelt-provider = { workspace = true }
smelt-store = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "io-util", "net", "process"] }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
thiserror = "2"
futures-util = { workspace = true }
rand = "0.10"
regex = "1"
smelt-perf = { version = "0.1.3", path = "../perf" }
keyring-core = "1.0.0"
smelt-buffer = { version = "0.5.0-alpha.8", path = "../buffer" }

[features]
# Exposes `fuzz_build_anthropic_body` / `fuzz_build_openai_body` for the
# `cache_invariance` fuzz target. Not for production use - these bypass
# the network layer and let fuzzers byte-compare cached prefixes.
fuzz = []

[dev-dependencies]
smelt-provider = { workspace = true, features = ["test-support"] }
smelt-store = { workspace = true, features = ["test-util"] }
smelt-test-support = { workspace = true }
serial_test = "3.4.0"
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.0", default-features = false, features = ["crypto-rust"] }
