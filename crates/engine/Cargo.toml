[package]
name = "smelt-engine"
version = "0.5.0-alpha.4"
edition = "2021"

[lib]
name = "engine"

[dependencies]
smelt-protocol = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "io-util", "net", "process"] }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
thiserror = "2"
futures-util = { workspace = true }
rand = "0.10"
keyring = "3"
minijinja = "2"
regex = "1"

[features]
# Exposes `fuzz_build_anthropic_body` / `fuzz_build_openai_body` for the
# `cache_invariance` fuzz target. Not for production use - these bypass
# the network layer and let fuzzers byte-compare cached prefixes.
fuzz = []

[dev-dependencies]
serial_test = "3.4.0"
tempfile.workspace = true
