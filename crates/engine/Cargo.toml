[package]
name = "smelt-engine"
version = "0.0.0-dev"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
name = "engine"

[dependencies]
smelt-paths = { workspace = true }
smelt-protocol = { workspace = true }
smelt-provider = { workspace = true }
smelt-store = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "io-util", "net", "process"] }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
futures-util = { workspace = true }
rand = "0.10"
smelt-perf = { version = "0.3.0", path = "../perf" }
smelt-text = { workspace = true }
uuid = { version = "1.29.0", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[features]
# Exposes `fuzz_build_anthropic_body` / `fuzz_build_openai_body` for the
# `cache_invariance` fuzz target. Not for production use - these bypass
# the network layer and let fuzzers byte-compare cached prefixes.
fuzz = []

[dev-dependencies]
smelt-provider = { workspace = true, features = ["test-support"] }
smelt-store = { workspace = true }
smelt-test-support = { workspace = true }
serial_test = "4.0.1"
tempfile.workspace = true
