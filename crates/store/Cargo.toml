[package]
name = "smelt-store"
version = "0.5.0-alpha.12"
edition = "2021"
rust-version.workspace = true
publish = false

[features]
default = []
test-util = []

[dependencies]
fs4 = "1.1.0"
getrandom = "0.4.3"
hostname = "0.4.2"
libc.workspace = true
rusqlite = { version = "0.40.1", default-features = false, features = ["backup", "blob", "bundled", "cache"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
smelt-buffer = { workspace = true }
smelt-perf = { workspace = true }
smelt-protocol = { workspace = true }
zstd = "0.13"

[dev-dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["functions", "hooks"] }
tempfile = { workspace = true }
