[package]
name = "smelt-store"
version = "0.5.0-alpha.9"
edition = "2021"

[features]
default = []
test-util = []

[dependencies]
fs4 = "1.1.0"
getrandom = "0.4.3"
hostname = "0.4.2"
libc.workspace = true
rusqlite = { version = "0.40.1", default-features = false, features = ["backup", "blob", "bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smelt-buffer = { version = "0.5.0-alpha.8", path = "../buffer" }
smelt-perf = { version = "0.1.3", path = "../perf" }
smelt-protocol = { workspace = true }
unicode-width.workspace = true
zstd = "0.13"

[dev-dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["functions"] }
tempfile = { workspace = true }
