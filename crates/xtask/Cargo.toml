[package]
name = "xtask"
version = "0.5.0-alpha.12"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
smelt-core = { workspace = true }
smelt-tui = { workspace = true, features = ["transcript-fixture"] }
smelt-protocol = { workspace = true }
smelt-store = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
smelt-perf.workspace = true
