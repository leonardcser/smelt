[package]
name = "smelt-edit"
version = "0.5.0-alpha.9"
edition = "2021"
rust-version.workspace = true
description = "Editor layer over smelt-term: Window + DrawContext, Buffer dispatch, vim modes, callbacks, overlays, focus + capture + click-tracking. The Ui struct that ties windows to layout."
license = "MIT"
repository = "https://github.com/leonardcser/seacret"

[lib]
name = "smelt_edit"
path = "src/lib.rs"

[dependencies]
smelt-term = { workspace = true }
smelt-buffer = { workspace = true }
crossterm = { workspace = true }
