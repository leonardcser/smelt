[package]
name = "smelt-ui"
version = "0.4.7"
edition = "2021"
description = "Persistent-window terminal UI: Buffer + Window + LayoutTree + Overlay + grid-diff renderer."
license = "MIT"
repository = "https://github.com/leonardcser/secret"

[lib]
name = "ui"
path = "src/lib.rs"

[dependencies]
ui-data = { package = "smelt-ui-data", path = "../ui-data" }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
unicode-width = "0.1"
